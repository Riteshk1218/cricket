# One-command local setup:  docker compose up --build
# Website: http://localhost:5173   API: http://localhost:8000/api/health/
# Phones on the same Wi-Fi: http://<laptop-ip>:5173 (app server address http://<laptop-ip>:8000)
# Local development only. Values can be overridden in a .env file next to this one.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cricket_live
      POSTGRES_USER: cricket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cricket_local_only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cricket -d cricket_live"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      POSTGRES_DB: cricket_live
      POSTGRES_USER: cricket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cricket_local_only}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: ""
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/data
      - media:/app/media
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
    restart: unless-stopped

volumes:
  pgdata:
  backend_data:
  media:
