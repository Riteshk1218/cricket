# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repository.
# Creates one free web service (website + API + live WebSockets on one
# address) and one free PostgreSQL database. No Redis is needed because
# there is only one server process.
services:
  - type: web
    name: criclive
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./deploy/render.Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: criclive-db
          property: connectionString
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      # Render asks you to type this when you create the Blueprint.
      - key: ADMIN_PASSWORD
        sync: false
      # "true" loads the demo tournaments and accounts on the first start.
      - key: SEED_DEMO
        value: "true"
      - key: SERVE_MEDIA
        value: "true"

databases:
  - name: criclive-db
    plan: free
    region: singapore
    databaseName: cricket_live
    user: cricket
