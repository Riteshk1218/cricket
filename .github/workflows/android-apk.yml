# Builds the Android debug APK on GitHub (free for public repos), so you don't
# need Flutter or Android Studio on your PC. Download it on your phone from
# https://github.com/<owner>/<repo>/releases/tag/android-latest (CricLive-debug.apk).
name: Build Android APK

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: criclive-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
      - run: cp build/app/outputs/flutter-apk/app-debug.apk build/CricLive-debug.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: CricLive Android app (latest debug build)
          body: |
            Debug APK for testing on your own phones (not for the Play Store).
            Install: open this page on the phone, tap CricLive-debug.apk, allow "Install unknown apps".
            Then in the app: More -> Settings -> Server address -> your Render address (https://<name>.onrender.com) or http://<laptop-wifi-ip>:8000 -> Save & Test connection.
            Built from commit ${{ github.sha }}.
          files: mobile/build/CricLive-debug.apk
          make_latest: true
